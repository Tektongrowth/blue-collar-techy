name: SEO health monitor (weekly)

on:
  schedule:
    - cron: "0 13 * * 1"  # Monday 9am ET (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet google-api-python-client google-auth

      - name: Run SEO health check
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/seo_health.py

      - name: Commit state snapshot
        run: |
          if [ -n "$(git status --porcelain .seo-state.json)" ]; then
            git config user.name "bct-bot"
            git config user.email "bot@bluecollartechy.com"
            git add .seo-state.json
            git commit -m "chore: weekly SEO health snapshot [skip ci]"
            git push
          fi
