<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-labelledby="title desc">
  <title id="title">Blue Collar Techy</title>
  <desc id="desc">Blue Collar Techy logo with orange gear mark and white text</desc>
  <defs>
