      .orange { fill: #ff6a1a; }
      .white { fill: #f5f5f7; }
      .word { font-family: 'Arial Black', Impact, system-ui, sans-serif; font-weight: 900; letter-spacing: -0.025em; }
      .techy { font-family: 'Arial Black', Impact, system-ui, sans-serif; font-weight: 900; font-style: italic; letter-spacing: 0.02em; }
    </style>
  </defs>
  <g transform="translate(34 28)">
    <g class="orange" transform="translate(88 88)">
      <g>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(0)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(30)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(60)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(90)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(120)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(150)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(180)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(210)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(240)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(270)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(300)"/>
        <rect x="-10" y="-82" width="20" height="28" rx="3" transform="rotate(330)"/>
      </g>
      <circle r="62"/>
