      <circle r="33"/>
      <text x="0" y="17" text-anchor="middle" font-family="Arial Black, Impact, system-ui, sans-serif" font-size="55" font-weight="900" fill="#08080d">B</text>
    </g>
    <text class="word white" x="196" y="87" font-size="78">BLUE COLLAR</text>
    <text class="techy orange" x="196" y="151" font-size="63">TECHY</text>
